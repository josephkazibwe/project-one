<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact us." />
    <title>Contact | Hello, World!</title>
    <style>
      :root { color-scheme: dark; --ink: #f7f4ff; --muted: #c8c1db; --cyan: #5eead4; }
      * { box-sizing: border-box; } body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow-x: hidden; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 12% 18%, rgba(94,234,212,.22), transparent 26rem), radial-gradient(circle at 86% 85%, rgba(157,123,255,.28), transparent 30rem), #100c1d; }
      .orb { position: fixed; width: 22rem; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(135deg, rgba(94,234,212,.22), rgba(157,123,255,.08)); animation: float 9s ease-in-out infinite; } .orb--one { top: -10rem; right: -7rem; } .orb--two { bottom: -13rem; left: -8rem; animation-delay: -4s; }
      main { width: min(90vw, 48rem); padding: 1rem; position: relative; z-index: 1; } nav { display: flex; justify-content: center; gap: .4rem; margin-bottom: 1rem; } nav a { padding: .55rem .85rem; border-radius: 999px; color: var(--muted); font-size: .9rem; font-weight: 700; text-decoration: none; transition: background 180ms ease, color 180ms ease; } nav a:hover, nav a[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.12); }
      .card { padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid rgba(255,255,255,.16); border-radius: 2rem; background: rgba(28,20,49,.68); box-shadow: 0 1.5rem 5rem rgba(0,0,0,.3); backdrop-filter: blur(18px); animation: appear 700ms cubic-bezier(.2,.7,.2,1) both; } .eyebrow { margin: 0 0 1rem; color: var(--cyan); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; } h1 { margin: 0; font-size: clamp(2.8rem, 9vw, 5.5rem); letter-spacing: -.06em; } h1 span { background: linear-gradient(100deg,#fff 10%,#d9ceff 48%,#5eead4); -webkit-background-clip: text; background-clip: text; color: transparent; } .intro { color: var(--muted); line-height: 1.7; }
      .email-link { margin-top: 0.8rem; }
      .email-link a { color: var(--cyan); text-decoration: none; font-weight: 700; }
      .email-link a:hover { text-decoration: underline; }
      form { display: grid; gap: 1rem; margin-top: 1.8rem; } label { display: grid; gap: .45rem; color: #e6e0f3; font-size: .9rem; font-weight: 700; } input, textarea { width: 100%; padding: .85rem 1rem; border: 1px solid rgba(255,255,255,.17); border-radius: .8rem; outline: none; color: var(--ink); font: inherit; background: rgba(255,255,255,.07); } input:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 .2rem rgba(94,234,212,.12); } textarea { min-height: 7rem; resize: vertical; } button { justify-self: start; padding: .8rem 1.2rem; border: 0; border-radius: 999px; color: #10221f; background: var(--cyan); font: inherit; font-weight: 800; cursor: pointer; } button:hover { filter: brightness(1.08); }
      @keyframes appear { from { opacity: 0; transform: translateY(1.5rem) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } } @keyframes float { 50% { transform: translate(1.5rem,2.5rem) scale(1.08); } }
    </style>
  </head>
  <body>
    <div class="orb orb--one" aria-hidden="true"></div><div class="orb orb--two" aria-hidden="true"></div>
    <main>
      <nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">Let’s connect</p><h1 id="page-title"><span>Say hello.</span></h1><p class="intro">Have an idea or simply want to get in touch? Leave a message below.</p>
        <p class="email-link"><a href="mailto:karoljosef246@gmail.com">karoljosef246@gmail.com</a></p>
        <form action="#" method="post"><label>Name<input type="text" name="name" autocomplete="name" placeholder="Your name" required /></label><label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required /></label><label>Message<textarea name="message" placeholder="What’s on your mind?" required></textarea></label><button type="submit">Send message</button></form>
      </section>
    </main>
  </body>
</html>
