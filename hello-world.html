<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A friendly hello world page." />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f4ff;
        --muted: #c8c1db;
        --violet: #9d7bff;
        --cyan: #5eead4;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(94, 234, 212, 0.22), transparent 28rem),
          radial-gradient(circle at 85% 80%, rgba(157, 123, 255, 0.28), transparent 30rem),
          #100c1d;
      }

      .orb {
        position: fixed;
        width: 22rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(94, 234, 212, 0.22), rgba(157, 123, 255, 0.08));
        filter: blur(1px);
        animation: float 9s ease-in-out infinite;
      }

      .orb--one { top: -10rem; right: -7rem; }
      .orb--two { bottom: -13rem; left: -8rem; animation-delay: -4s; }

      main {
        width: min(90vw, 48rem);
        padding: 1rem;
        position: relative;
        z-index: 1;
      }

      nav {
        display: flex;
        justify-content: center;
        gap: 0.4rem;
        margin-bottom: 1rem;
      }

      nav a {
        padding: 0.55rem 0.85rem;
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        transition: background 180ms ease, color 180ms ease;
      }

      nav a:hover, nav a[aria-current="page"] {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.12);
      }

      .card {
        padding: clamp(2rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 2rem;
        background: rgba(28, 20, 49, 0.68);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(18px);
        animation: appear 700ms cubic-bezier(.2, .7, .2, 1) both;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 11vw, 6.5rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }

      h1 span {
        background: linear-gradient(100deg, #ffffff 10%, #d9ceff 48%, #5eead4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        max-width: 32rem;
        margin: 1.75rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin-top: 2rem;
        padding: 0.72rem 1rem;
        border: 1px solid rgba(94, 234, 212, 0.25);
        border-radius: 999px;
        color: #e6fffa;
        background: rgba(94, 234, 212, 0.1);
        font-size: 0.92rem;
      }

      .dot {
        width: 0.55rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 0.8rem var(--cyan);
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(1.5rem) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes float {
        50% { transform: translate(1.5rem, 2.5rem) scale(1.08); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb--one" aria-hidden="true"></div>
    <div class="orb orb--two" aria-hidden="true"></div>
    <main>
      <nav aria-label="Primary navigation">
        <a href="hello-world.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">Your first web page</p>
        <h1 id="page-title"><span>Hello, World!</span></h1>
        <p class="subtitle">A small beginning with a little sparkle. The web is yours to make.</p>
        <div class="tag"><span class="dot"></span> Ready to build something great</div>
      </section>
    </main>
  </body>
</html>
