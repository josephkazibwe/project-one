<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="About this bright little corner of the web." />
    <title>About | Hello, World!</title>
    <style>
      :root { color-scheme: dark; --ink: #f7f4ff; --muted: #c8c1db; --cyan: #5eead4; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow-x: hidden; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 12% 18%, rgba(94,234,212,.22), transparent 26rem), radial-gradient(circle at 86% 85%, rgba(157,123,255,.28), transparent 30rem), #100c1d; }
      .orb { position: fixed; width: 22rem; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(135deg, rgba(94,234,212,.22), rgba(157,123,255,.08)); animation: float 9s ease-in-out infinite; }
      .orb--one { top: -10rem; right: -7rem; } .orb--two { bottom: -13rem; left: -8rem; animation-delay: -4s; }
      main { width: min(90vw, 48rem); padding: 1rem; position: relative; z-index: 1; }
      nav { display: flex; justify-content: center; gap: .4rem; margin-bottom: 1rem; }
      nav a { padding: .55rem .85rem; border-radius: 999px; color: var(--muted); font-size: .9rem; font-weight: 700; text-decoration: none; transition: background 180ms ease, color 180ms ease; }
      nav a:hover, nav a[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.12); }
      .card { padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid rgba(255,255,255,.16); border-radius: 2rem; background: rgba(28,20,49,.68); box-shadow: 0 1.5rem 5rem rgba(0,0,0,.3); backdrop-filter: blur(18px); animation: appear 700ms cubic-bezier(.2,.7,.2,1) both; }
      .eyebrow { margin: 0 0 1rem; color: var(--cyan); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.8rem, 9vw, 5.5rem); letter-spacing: -.06em; } h1 span { background: linear-gradient(100deg,#fff 10%,#d9ceff 48%,#5eead4); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { color: var(--muted); font-size: 1.08rem; line-height: 1.75; } .highlight { margin-top: 1.7rem; padding: 1.2rem 1.3rem; border-left: 3px solid var(--cyan); border-radius: .5rem 1rem 1rem .5rem; background: rgba(94,234,212,.08); color: #e6fffa; }
      @keyframes appear { from { opacity: 0; transform: translateY(1.5rem) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } } @keyframes float { 50% { transform: translate(1.5rem,2.5rem) scale(1.08); } }
    </style>
  </head>
  <body>
    <div class="orb orb--one" aria-hidden="true"></div><div class="orb orb--two" aria-hidden="true"></div>
    <main>
      <nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html" aria-current="page">About</a><a href="contact.html">Contact</a></nav>
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">A little introduction</p><h1 id="page-title"><span>About us.</span></h1>
        <p>We believe every great idea starts somewhere—often with a simple hello. This is a welcoming space for curiosity, creativity, and the projects still waiting to take shape.</p>
        <p class="highlight">Small beginnings can grow into remarkable things.</p>
      </section>
    </main>
  </body>
</html>
